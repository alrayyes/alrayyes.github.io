name: Bug report
description: Something on the site is broken or wrong.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "As a ‹who›, I want ‹what›, so that ‹why›. What's wrong, and what does it get in the way of?"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The page, the browser, and what you did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to see instead.
    validations:
      required: true
