# Dependabot raises the pull request; CI decides whether it lands. Everything
# here is pinned to an exact version, which is the whole reason this works —
# a floating range drifts silently and there's nothing to raise a pull
# request about.
#
# Two pins Dependabot can't see, and which are updated by hand: the Vale
# version in prose.yml/CONTRIBUTING.md and the gitleaks version in
# gitleaks.yml. Neither lives anywhere Dependabot's ecosystems look.
version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: fix
      include: scope
    groups:
      bun-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    # @astrojs/check (via @astrojs/language-server) depends on TypeScript's
    # Language Service API, which TS 7's native compiler ("Strada") doesn't
    # carry forward and hasn't replaced yet - confirmed live on #23,
    # `astro check` fails outright with "does not expose the programmatic
    # API that astro check relies on". Tracked upstream:
    # https://github.com/withastro/roadmap/discussions/1321. Remove this
    # once @astrojs/check ships TS 7 support.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
