# Dependabot has no built-in `automerge: true` the way Renovate does — see
# releases.md's "Dependency bots" section. This is that mechanism for a
# GitHub-primary repo: gate on the actor, wait for the same checks every
# other pull request waits for, then arm auto-merge the same way a human
# would from the UI.
#
# pull_request, not pull_request_target: Dependabot's pull requests come
# from a branch on this repo, never a fork, so there's no untrusted checkout
# to guard against. GitHub grants the default GITHUB_TOKEN elevated
# permissions for pull_request events actor'd by dependabot[bot]
# specifically — pull_request_target would trade that away for nothing.
name: dependabot-auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

env:
  LEFTHOOK: "0"

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # ci.yml is the gate; this only arms the merge and lets GitHub wait
      # for that gate itself, rather than polling it from inside the job.
      # Every update type: a SHA-pinned action bump reports no semver type,
      # and a major is covered by the same checks as anything else.
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
