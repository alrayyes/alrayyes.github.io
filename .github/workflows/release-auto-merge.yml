# release-please has no built-in auto-merge either — same gap as
# Dependabot, same fix: gate on the label release-please itself applies,
# wait for the same checks every other pull request waits for, then arm
# auto-merge the same way a human would from the UI.
#
# pull_request, not pull_request_target: release-please's pull request
# comes from a branch on this repo, never a fork, so there's no untrusted
# checkout to guard against.
name: release-auto-merge

# `labeled` as well as the defaults: release-please adds `autorelease: pending`
# about a second after it opens the PR, so the `opened` event carries no label
# yet and the job below is skipped. The `labeled` event is the one that has it.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write

env:
  LEFTHOOK: "0"

jobs:
  auto-merge:
    # release-please labels its own pull request "autorelease: pending"
    # and re-labels it "autorelease: tagged" once merged — checking the
    # label rather than the actor, since the PR is opened by whichever
    # identity runs googleapis/release-please-action, not a bot account.
    if: "contains(github.event.pull_request.labels.*.name, 'autorelease: pending')"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # RELEASE_TOKEN, not the default GITHUB_TOKEN: GitHub suppresses the
      # push event a GITHUB_TOKEN-performed merge produces (to stop
      # recursive runs), which would otherwise leave this repo's own
      # release workflow's `push` trigger never firing after an
      # auto-merged release PR lands on main.
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
