# Keeps one open `Dependency advisories` ticket for every advisory in the
# lockfile on main: created when findings appear, updated when they change,
# closed when the audit is clean. The pull request gate in ci.yml fails only
# on advisories a change introduces, so this is where the rest are tracked.
name: advisory-scan

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths: [package.json, bun.lock]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: alrayyes/advisory-scan@c9f794de4354b870e159510f036779baf20f4a2f # main after v0.1.0
        with:
          mode: scan
          command: bun audit
          labels: dependencies
