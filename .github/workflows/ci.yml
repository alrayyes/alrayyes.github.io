# The gate. Every command in here has a twin in lefthook.yml, so a green
# pre-commit means a green pipeline and neither can drift into being the only
# place a rule is enforced.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LEFTHOOK: "0"

jobs:
  # Works out which files this run touches, so each job below runs only when
  # something it reads changed. A job skipped by `if:` reports success, which
  # keeps the required checks green on a docs-only pull request; a workflow
  # skipped by `paths:` would stay pending and block it. `commits` and the
  # secret scan are never filtered, and `workflow_dispatch` runs everything.
  # So does a push: a deploy replaces the whole site, and the test and
  # coverage reports come from the test job, so a deploy that skipped it
  # would delete them.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      site: ${{ steps.groups.outputs.site }}
      deps: ${{ steps.groups.outputs.deps }}
      security: ${{ steps.groups.outputs.security }}
      prose: ${{ steps.groups.outputs.prose }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: groups
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # No usable base (a manual run, a first push, a base that's no longer
          # in history): run everything rather than guess.
          if [ "$EVENT" != pull_request ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            printf 'site=true\ndeps=true\nsecurity=true\nprose=true\n' | tee -a "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE...HEAD" | ./scripts/changed-groups.sh | tee -a "$GITHUB_OUTPUT"
          fi
  lint:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: biome check
        run: bun run lint
      - name: oxlint (shadcn/lint Tailwind rules)
        run: bun run lint:tailwind
      - name: sort-package-json --check
        run: bun run sort-package-json:check
      - name: astro check
        run: bun run check

  audit:
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: bun audit
        # No patched release exists for either advisory (first_patched_version
        # is null). Both packages are build and lint time only; neither ships
        # in the static site. Drop the ignores once a patch lands. See #67.
        run: bun audit --ignore=GHSA-vfj7-8cjw-p6xm --ignore=GHSA-ch52-4w7c-c8xp || (sleep 5 && bun audit --ignore=GHSA-vfj7-8cjw-p6xm --ignore=GHSA-ch52-4w7c-c8xp)

  # Biome's pattern-based rules (lint, above) can't do cross-file taint
  # tracking; this is the separate security pass that can — the free
  # Semgrep Registry ruleset, no paid tier or account needed.
  security:
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: semgrep/semgrep@sha256:51c9f53a4fce0d55e9abd08d7b96968654248a4b1122e77f20e0a49c0072446c # 1.175.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: semgrep
        run: semgrep scan --config auto --error

  test:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: install playwright's browser
        run: |
          bunx playwright install --with-deps chromium ||
            (sleep 5 && bunx playwright install --with-deps chromium)
      - name: unit tests with coverage
        run: |
          mkdir -p junit
          bun run test:coverage --reporter=junit --reporter-outfile=junit/unit.xml
      - name: coverage as Cobertura XML and an HTML view
        # lcov.info is what bun writes; the reports we publish are the
        # Cobertura XML and genhtml's browsable view of it. Runs on pull
        # requests too, so a broken step shows up before a merge, not on main.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lcov
          pipx run --spec lcov_cobertura==2.1.1 lcov_cobertura coverage/lcov.info --output coverage/coverage.xml
          genhtml coverage/lcov.info --output-directory coverage/html
      - name: upload coverage to Codecov
        # Dependabot runs get Dependabot's own secret store, which has no
        # CODECOV_TOKEN, so the upload would fail a pull request that changed
        # nothing about coverage.
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true
      - name: playwright test
        run: bun run test:e2e
        # The build Playwright serves is the one Codecov measures on a pull
        # request, so the bundle report appears there too.
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: upload test results to Codecov
        # Even when a test failed: a red run is what test analytics is for.
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit/unit.xml,playwright-report/junit.xml
          fail_ci_if_error: true
      - name: upload the report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: assemble the test and coverage reports
        run: bun scripts/assemble-reports.ts site-reports
      - name: keep the reports for the deploy
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: site-reports/
          if-no-files-found: error
          retention-days: 1

  # Layout and structure. Style and mechanics are prose.yml — see its header
  # comment for why they're split out.
  prose:
    needs: changes
    if: needs.changes.outputs.prose == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: prettier --check
        run: bun run format:check
      - name: markdownlint
        run: bun run lint:md

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: commitlint
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

  # Builds the static site and deploys it to GitHub Pages, served at the
  # custom domain apis.ryankes.eu (public/CNAME, DNS CNAME already pointed at
  # alrayyes.github.io). Deliberately GitHub Pages, not Cloudflare: this
  # repo's own domain has to resolve through the github.io Pages target, so
  # there's no Cloudflare Worker to deploy to the way this account's other
  # Astro sites deploy.
  #
  # Lives in this workflow, not its own, so `needs` can hold the deploy back
  # until every gate above is green. A red lint, test, audit or semgrep run
  # on main ships nothing.
  #
  # A job that needs a skipped job is skipped too, so the gates can't simply
  # be `needs`: a docs-only push would skip the build. `always()` lets a
  # skipped gate through, and the two `contains` checks still stop a failed
  # or cancelled one.
  build:
    needs: [lint, audit, security, test, prose]
    if: >-
      always() && github.event_name != 'pull_request'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        run: bun install --frozen-lockfile
      - name: build
        run: bun run build
        # Uploads the bundle report for main, the baseline pull requests are
        # compared against.
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: add the test and coverage reports
        # After the build, which empties dist/. Served at
        # apis.ryankes.eu/reports/. This is the user site, so Pages redirects
        # its own /alrayyes.github.io/ prefix to the root: the /<repo>/reports/
        # the other repos use would 404 here.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reports
          path: dist/reports
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    # A newer push must not cancel a deploy that's already publishing, so this
    # job opts out of the workflow's cancel-in-progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
