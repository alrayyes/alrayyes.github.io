# The same commands CI runs, so the two cannot drift. The hook catches it
# early; CI is the gate that cannot be skipped.

pre-commit:
  jobs:
    - name: biome
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - name: prettier
      glob: "*.{md,yml,yaml,astro}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true

    - name: markdownlint
      glob: "*.md"
      # --no-globs: the `globs` in .markdownlint-cli2.yaml are added to any
      # file list, so without it this lints the whole tree, not the commit.
      run: bunx markdownlint-cli2 --no-globs {staged_files}

    - name: sort-package-json
      glob: "package.json"
      run: bunx sort-package-json {staged_files}
      stage_fixed: true

    - name: vale
      glob: "*.md"
      exclude:
        - "CHANGELOG.md"
        - ".claude/**"
        - "openspec/changes/**"
        - "openspec/specs/**"
      run: vale {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

# The globs below mirror scripts/changed-groups.sh, so the hook skips what the
# pipeline skips: a docs-only push doesn't run Playwright locally either.
pre-push:
  parallel: true
  jobs:
    - name: unit
      run: bun run test:unit
      glob:
        - "src/**"
        - "public/**"
        - "tests/**"
        - "scripts/changed-groups.*"
        - "astro.config.mjs"
        - "tsconfig.json"
        - "package.json"
        - "bun.lock"
        - "biome.json"
        - ".oxlintrc.json"
        - "playwright.config.ts"
        - "CHANGELOG.md"
        - "LICENSE"

    - name: e2e
      run: bun run test:e2e
      glob:
        - "src/**"
        - "public/**"
        - "tests/**"
        - "scripts/changed-groups.*"
        - "astro.config.mjs"
        - "tsconfig.json"
        - "package.json"
        - "bun.lock"
        - "biome.json"
        - ".oxlintrc.json"
        - "playwright.config.ts"
        - "CHANGELOG.md"
        - "LICENSE"

    - name: check
      run: bun run check
      glob:
        - "src/**"
        - "public/**"
        - "tests/**"
        - "scripts/changed-groups.*"
        - "astro.config.mjs"
        - "tsconfig.json"
        - "package.json"
        - "bun.lock"
        - "biome.json"
        - ".oxlintrc.json"
        - "playwright.config.ts"
        - "CHANGELOG.md"
        - "LICENSE"

    - name: biome
      run: bun run lint
      glob:
        - "src/**"
        - "public/**"
        - "tests/**"
        - "scripts/changed-groups.*"
        - "astro.config.mjs"
        - "tsconfig.json"
        - "package.json"
        - "bun.lock"
        - "biome.json"
        - ".oxlintrc.json"
        - "playwright.config.ts"
        - "CHANGELOG.md"
        - "LICENSE"

    - name: tailwind
      run: bun run lint:tailwind
      glob:
        - "src/**"
        - "public/**"
        - "tests/**"
        - "scripts/changed-groups.*"
        - "astro.config.mjs"
        - "tsconfig.json"
        - "package.json"
        - "bun.lock"
        - "biome.json"
        - ".oxlintrc.json"
        - "playwright.config.ts"
        - "CHANGELOG.md"
        - "LICENSE"

    - name: prettier
      run: bun run format:check
      glob:
        - "**/*.{md,yml,yaml,astro}"
        - ".prettierrc.json"
        - ".prettierignore"
        - ".markdownlint-cli2.yaml"

    - name: markdownlint
      run: bun run lint:md
      glob:
        - "**/*.{md,yml,yaml,astro}"
        - ".prettierrc.json"
        - ".prettierignore"
        - ".markdownlint-cli2.yaml"

    - name: sort-package-json
      run: bun run sort-package-json:check
      glob:
        - "package.json"

    - name: vale
      run: bun run lint:prose
      glob: "**/*.md"

    - name: mechanics
      run: bun run lint:mechanics
      glob: "**/*.md"
